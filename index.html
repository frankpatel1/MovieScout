<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Movies Scout | Discover Movies & Web Series</title>
     <!--==fav-icon=======================-->
    <link rel="shortcut icon" href="images/logo.png"/>
</head>
<body>
    
    <header class="site-header">
        <div class="branding">
            <h1>Movies Scout</h1>
            <p>Find the best movies and web series</p>
        </div>
        <form  id="form">
            <label class="sr-only" for="search">Search movies and web series</label>
            <input type="text" placeholder="Search movies and web series" id="search" class="search">
        </form>
    </header>
    <section class="browse-controls" aria-label="Browse options">
        <div class="media-switcher" role="group" aria-label="Choose media type">
            <button class="media-tab active" type="button" data-media-type="movie">Movies</button>
            <button class="media-tab" type="button" data-media-type="tv">Web Series</button>
        </div>
        <label class="sort-control" for="sort-select">
            <span>Sort by</span>
            <select id="sort-select">
                <option value="trending">Trending</option>
                <option value="rating">Highest Rating</option>
                <option value="latest">Latest Release</option>
            </select>
        </label>
    </section>
    <div id="tags"></div>
    <div id="myNav" class="overlay">

        <!-- Button to close the overlay navigation -->
        <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
      
        <!-- Overlay content -->
        <div class="overlay-content" id="overlay-content"></div>
        
        <a href="javascript:void(0)" class="arrow left-arrow" id="left-arrow">&#8656;</a> 
        
        <a href="javascript:void(0)" class="arrow right-arrow" id="right-arrow" >&#8658;</a>

      </div>
    <main id="main"></main>
    <div class="pagination">
        <div class="page" id="prev">Previous Page</div>
        <div class="current" id="current">1</div>
        <div class="page" id="next">Next Page</div>

    </div>

    <script src="js/script.js"></script>
</body>
</html>
